name: CI

on:
  push:
    branches: ["main", "master", "portfolio/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate package CLI
        run: |
          python -m pai_pipeline list
          python -m pai_pipeline check-config

      - name: Run offline tests
        run: python -m pytest

      - name: Check Python lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Run static security analysis
        run: python -m bandit -q -r src -c pyproject.toml

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
