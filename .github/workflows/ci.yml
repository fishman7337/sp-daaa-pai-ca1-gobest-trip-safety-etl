name: CI

on:
  push:
    branches: ["main", "master", "portfolio/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate package CLI
        run: |
          python -m pai_pipeline list
          python -m pai_pipeline check-config

      - name: Run offline tests
        run: python -m pytest

      - name: Check Python lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall src tests scripts

      - name: Run static security analysis
        run: python -m bandit -q -r src -c pyproject.toml

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
